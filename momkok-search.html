<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>알라딘 맘콕 대학·학과 검색기 - 전국 4년제/전문대 입결·진로 실시간 조회</title>
  <meta name="description" content="전국 400여 개 대학교 학과별 수시/정시 합격 등급컷, 등록금, 10년 뒤 유망 직업 로드맵 실시간 자동 검색. 맘콕 AI 입시·진로 빅데이터!">
  <meta name="keywords" content="알라딘 맘콕, 알라딘맘콕, 대학검색, 학과검색, 대입입결, 2026수시등급컷, 2026정시컷, 맘콕, 대학알리미, 등록금조회, 학과추천">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.momkok.co.kr/momkok-search.html">
  <meta property="og:title" content="알라딘 맘콕 (Aladdin MomKok) - 전국 대학·학과 실시간 입시·진로 검색기">
  <meta property="og:description" content="전국 대학 입시 결과, 수시/정시 컷, 특화 학과 실시간 자동 검색">

  <meta name="naver-site-verification" content="9867fb6697cecf67940ff28242a2755d3430b75d" />
  <meta name="google-site-verification" content="google01007955e0e47517.html" />
  <link rel="canonical" href="https://www.momkok.co.kr/momkok-search.html" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --primary: #ff4757;
      --primary-dark: #ee5253;
      --navy: #1e293b;
      --slate: #475569;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background: var(--bg); color: var(--navy); line-height: 1.5; }

    /* 헤더 */
    .search-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand-link { font-size: 18px; font-weight: 900; color: var(--primary); text-decoration: none; }
    .diag-btn {
      background: var(--primary); color: #fff; font-size: 13px; font-weight: 700;
      padding: 6px 14px; border-radius: 20px; text-decoration: none;
    }

    /* 검색 배너 */
    .search-hero {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff; padding: 32px 16px 24px; text-align: center;
    }
    .search-hero h1 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .search-hero p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

    /* 검색창 */
    .search-box-wrap { max-width: 600px; margin: 0 auto; position: relative; }
    .search-input {
      width: 100%; padding: 16px 20px 16px 48px; border-radius: 16px;
      border: 2px solid #ff6b81; font-size: 16px; font-weight: 600;
      outline: none; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .search-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 20px; color: #94a3b8;
    }

    /* 필터 영역 */
    .filter-container {
      max-width: 680px; margin: 16px auto 0; padding: 0 16px;
    }
    .filter-row {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-pill {
      background: #fff; border: 1px solid var(--border); padding: 6px 14px;
      border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--slate);
      white-space: nowrap; cursor: pointer; transition: all 0.2s;
    }
    .filter-pill.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }

    /* 검색 결과 리스트 */
    .results-container {
      max-width: 680px; margin: 16px auto 80px; padding: 0 16px;
    }
    .result-count-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; font-size: 13px; color: var(--slate); font-weight: 600;
    }
    .univ-card {
      background: #fff; border: 1px solid var(--border); border-radius: 16px;
      padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      cursor: pointer; transition: all 0.2s;
    }
    .univ-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .univ-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .univ-name { font-size: 17px; font-weight: 800; color: var(--navy); }
    .univ-badges { display: flex; gap: 4px; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
    }
    .badge-sido { background: #e0f2fe; color: #0284c7; }
    .badge-fnd { background: #f1f5f9; color: #475569; }
    .univ-info-row { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .dept-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .dept-tag {
      background: #fff0f1; color: var(--primary); font-size: 11px;
      padding: 4px 8px; border-radius: 8px; font-weight: 600;
    }

    /* 상세 모달 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: #fff; width: 100%; max-width: 500px; border-radius: 20px;
      max-height: 85vh; overflow-y: auto; padding: 24px; position: relative;
    }
    .modal-close-btn {
      position: absolute; right: 18px; top: 18px; font-size: 20px;
      background: none; border: none; cursor: pointer; color: #94a3b8;
    }

    /* 하단 플로팅 배너 */
    .bottom-cta-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 99;
      background: #fff; border-top: 1px solid var(--border); padding: 10px 16px;
      display: flex; gap: 10px; align-items: center; max-width: 680px; margin: 0 auto;
    }
    .cta-full-btn {
      flex: 1; background: var(--primary); color: #fff; padding: 14px;
      border-radius: 12px; font-weight: 800; font-size: 15px; text-align: center;
      text-decoration: none; box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header class="search-header">
    <a href="./momkok-landing.html" class="brand-link">🪔 알라딘 맘콕 (MomKok)</a>
    <a href="./index.html" class="diag-btn">무료 진단하기</a>
  </header>

  <!-- 검색 히어로 -->
  <section class="search-hero">
    <h1>전국 대학·학과 실시간 검색</h1>
    <p>전국 400여 개 대학 수시/정시 입결 및 등록금 공시 데이터</p>
    
    <div class="search-box-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="대학명 또는 학과명을 입력하세요 (예: 연세대, 간호, 컴공)">
    </div>
  </section>

  <!-- 지역 필터 -->
  <div class="filter-container">
    <div class="filter-row" id="sidoFilterRow">
      <div class="filter-pill active" data-sido="전체">전국 전체</div>
      <div class="filter-pill" data-sido="서울">서울</div>
      <div class="filter-pill" data-sido="경기">경기</div>
      <div class="filter-pill" data-sido="인천">인천</div>
      <div class="filter-pill" data-sido="대전">대전</div>
      <div class="filter-pill" data-sido="대구">대구</div>
      <div class="filter-pill" data-sido="부산">부산</div>
      <div class="filter-pill" data-sido="광주">광주</div>
      <div class="filter-pill" data-sido="전남">전남</div>
      <div class="filter-pill" data-sido="전북">전북</div>
      <div class="filter-pill" data-sido="충남">충남</div>
      <div class="filter-pill" data-sido="충북">충북</div>
      <div class="filter-pill" data-sido="경남">경남</div>
      <div class="filter-pill" data-sido="경북">경북</div>
      <div class="filter-pill" data-sido="강원">강원</div>
      <div class="filter-pill" data-sido="제주">제주</div>
    </div>
  </div>

  <!-- 결과 리스트 -->
  <div class="results-container">
    <div class="result-count-bar">
      <span>검색 결과: <strong id="resultCount" style="color:var(--primary);">0</strong>개 대학</span>
      <span>대교협 2025~2026 기준</span>
    </div>
    <div id="univList">
      <!-- 동적 생성 -->
    </div>
  </div>

  <!-- 상세 모달 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- 하단 고정 바 -->
  <div class="bottom-cta-bar">
    <a href="./index.html" class="cta-full-btn">🎯 우리 아이 성향에 맞는 대학·학과 AI 족집게 진단받기</a>
  </div>

  <script src="./univ-data.js"></script>
  <script>
    let currentSido = '전체';
    let searchKeyword = '';
    const univListEl = document.getElementById('univList');
    const resultCountEl = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');

    function render() {
      const all = window.MOMKOK_ALL_UNIVS || [];
      const filtered = all.filter(u => {
        const matchSido = (currentSido === '전체') || (u.sido && u.sido.includes(currentSido));
        const matchKey = !searchKeyword || 
          (u.name && u.name.toLowerCase().includes(searchKeyword.toLowerCase())) ||
          (u.sigun && u.sigun.toLowerCase().includes(searchKeyword.toLowerCase())) ||
          (u.fnd && u.fnd.toLowerCase().includes(searchKeyword.toLowerCase()));
        return matchSido && matchKey;
      });

      resultCountEl.textContent = filtered.length;

      if (filtered.length === 0) {
        univListEl.innerHTML = `
          <div style="text-align:center; padding:40px 20px; background:#fff; border-radius:16px; border:1px solid var(--border);">
            <p style="font-size:16px; font-weight:700; color:var(--slate);">검색된 대학이 없습니다.</p>
            <p style="font-size:13px; color:#94a3b8; margin-top:6px;">검색어를 변경하거나 필터를 '전국 전체'로 바꿔보세요.</p>
          </div>
        `;
        return;
      }

      univListEl.innerHTML = filtered.slice(0, 50).map((u, i) => `
        <div class="univ-card" onclick="openDetail(${i}, '${encodeURIComponent(JSON.stringify(u))}')">
          <div class="univ-top">
            <div class="univ-name">${u.name}</div>
            <div class="univ-badges">
              <span class="badge badge-sido">${u.sido} ${u.sigun || ''}</span>
              <span class="badge badge-fnd">${u.fnd || '대학'}</span>
            </div>
          </div>
          <div class="univ-info-row">
            📍 주소: ${u.addr || '정보 준비 중'} · 🏫 구분: ${u.univSe || '4년제'}
          </div>
          <div class="dept-tags">
            <span class="dept-tag">🎯 대교협 입결 70% 컷 제공</span>
            <span class="dept-tag">📊 수시/정시 합격 가이드</span>
            <span class="dept-tag" style="background:#f1f5f9; color:#475569;">자세히 보기 ></span>
          </div>
        </div>
      `).join('');
    }

    // 필터 클릭 이벤트
    document.getElementById('sidoFilterRow').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-pill')) {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        currentSido = e.target.getAttribute('data-sido');
        render();
      }
    });

    // 검색창 입력 이벤트
    searchInput.addEventListener('input', (e) => {
      searchKeyword = e.target.value.trim();
      render();
    });

    // 모달 열기
    function openDetail(index, encodedUniv) {
      const u = JSON.parse(decodeURIComponent(encodedUniv));
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <div style="font-size:20px; font-weight:900; color:var(--navy); margin-bottom:6px;">${u.name}</div>
        <div style="font-size:13px; color:var(--primary); font-weight:700; margin-bottom:16px;">
          ${u.sido} ${u.sigun || ''} · ${u.fnd || '대학교'} · ${u.univSe || '4년제'}
        </div>
        <div style="background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:14px; font-size:13px; line-height:1.7; margin-bottom:20px;">
          <div>📍 <strong>캠퍼스 위치:</strong> ${u.addr || '해당 캠퍼스 공시'}</div>
          <div>🌐 <strong>공식 웹사이트:</strong> <a href="${u.site || '#'}" target="_blank" style="color:#0284c7;">${u.site || '홈페이지 바로가기'}</a></div>
          <div>📊 <strong>입학 전형:</strong> 학생부교과, 학생부종합, 정시(수능)</div>
        </div>
        <div style="background:#fff0f1; border:1px solid #fecdd3; border-radius:12px; padding:16px; text-align:center;">
          <div style="font-size:14px; font-weight:800; color:#9f1239; margin-bottom:6px;">우리 아이 ${u.name} 합격 가능성은?</div>
          <p style="font-size:12px; color:#4c0519; margin-bottom:12px;">아이의 타고난 기질과 성적을 바탕으로 맞춤 학과 및 합격 로드맵을 무료로 확인해 보세요.</p>
          <a href="./index.html" style="display:block; background:var(--primary); color:#fff; font-weight:800; padding:12px; border-radius:10px; text-decoration:none;">
            🎯 ${u.name} 맘콕 AI 정밀 진단받기
          </a>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
