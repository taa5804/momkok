<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맘콕(MomKok) - 자녀 1:1 맞춤 정밀 리포트 직통 뷰어</title>
  <meta name="theme-color" content="#1e3a8a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; line-height: 1.6; }

    /* 모바일 최상단 직통 고정 헤더 */
    .direct-top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.25);
    }
    .direct-top-title-sub {
      font-size: 11.5px;
      color: #93c5fd;
      font-weight: 700;
    }
    .direct-top-title-main {
      font-size: 16px;
      font-weight: 900;
      margin-top: 2px;
    }
    .btn-pdf-download {
      background: #fbbf24;
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(251, 191, 36, 0.4);
      transition: all 0.15s ease;
    }
    .btn-pdf-download:active {
      transform: scale(0.97);
    }

    /* 본문 리포트 컨테이너 */
    .report-main-wrap {
      max-width: 900px;
      margin: 20px auto 40px auto;
      padding: 0 16px;
    }

    .report-tier-view {
      display: block;
      width: 100%;
    }

    .rpt-card {
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }
    .rpt-title {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 8px;
    }
    .rpt-desc {
      font-size: 13.5px;
      line-height: 1.75;
      color: #334155;
    }

    /* 하단 대형 인쇄 & 저장 바 */
    .direct-bottom-bar {
      background: #eff6ff;
      border: 2px solid #2563eb;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      margin-top: 36px;
      margin-bottom: 30px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
    }

    /* A4 인쇄 및 PDF 저장 전용 스타일 */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 12pt;
      }
      .direct-top-bar, .direct-bottom-bar, .pc-print-bottom-bar, button {
        display: none !important;
      }
      .report-main-wrap {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .rpt-card {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        box-shadow: none !important;
        border: 1px solid #94a3b8 !important;
        margin-bottom: 24px !important;
      }
    }
  </style>
</head>
<body>

  <!-- [상단 고정 직통 바] -->
  <header class="direct-top-bar">
    <div>
      <div class="direct-top-title-sub">맘콕(MomKok) 자녀 1:1 맞춤 모바일 바인더</div>
      <div id="directHeaderTitle" class="direct-top-title-main">👑 [전권 35장 완결] VIP 대입·학습 마스터 바이블</div>
    </div>
    <button type="button" onclick="window.print()" class="btn-pdf-download">
      📥 내 휴대폰에 PDF 영구 저장하기
    </button>
  </header>

  <!-- [순수 리포트 본문 영역 - 메인 입력창/배너 일절 없음] -->
  <main class="report-main-wrap">
    <div id="tierViewMaster" class="report-tier-view"></div>
    <div id="tierViewBasic" class="report-tier-view" style="display:none;"></div>

    <div class="direct-bottom-bar">
      <div style="font-size:17px; font-weight:900; color:#1e40af; margin-bottom:5px;">
        🖨️ A4 용지 인쇄 및 PDF 영구 소장
      </div>
      <div style="font-size:13px; color:#3b82f6; margin-bottom:16px;">
        자녀 책상 비치 및 입시 상담 지참을 위해 전권을 A4 용지로 출력하거나 스마트폰에 영구 소장하세요.
      </div>
      <button type="button" onclick="window.print()" style="background:#2563eb; color:#ffffff; border:none; padding:12px 32px; border-radius:10px; font-size:15px; font-weight:900; cursor:pointer; box-shadow:0 4px 14px rgba(37,99,235,0.35);">
        🖨️ 전체 A4 인쇄 / PDF 저장하기
      </button>
    </div>
  </main>

  <!-- 엔진 스크립트 로드 (메인 화면 로직 없이 순수 리포트만 렌더링) -->
  <script src="momkok-engine.js?v=20261024_08"></script>

  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view') || '35';
        const code = params.get('code') || params.get('c') || '5804';
        const is35 = (view === '35' || view === 'master');

        const titleEl = document.getElementById('directHeaderTitle');
        if (titleEl) {
          titleEl.textContent = is35
            ? '👑 [전권 35장 완결] VIP 대입·학습 마스터 바이블'
            : '🎯 [전권 20장 완결] 실전 진로·입시 정밀 바인더';
        }

        // 2자녀 열람 제한 (만능키 5804 제외)
        if (code && code !== '5804') {
          const usageKey = 'momkok_code_usage_' + code;
          let usedCount = parseInt(localStorage.getItem(usageKey) || '0', 10);
          if (usedCount >= 2) {
            alert('⛔ [알림번호 열람 횟수 만료 (총 2회 소진)]\n\n해당 알림번호는 [자녀 2명(첫째+둘째) 총 2회 열람·소장 혜택]이 모두 소진되었습니다.\n\n(※ 이미 저장해 두신 PDF 파일로 열람해 주세요.)');
            document.body.innerHTML = '<div style="padding:50px 20px; text-align:center; font-family:sans-serif;"><h2>⛔ 알림번호 열람 횟수 만료 (총 2회 소진)</h2><p style="margin-top:10px; color:#64748b;">이미 휴대폰에 다운로드하신 PDF 파일로 열람해 주시기 바랍니다.</p></div>';
            return;
          }
          usedCount += 1;
          localStorage.setItem(usageKey, usedCount.toString());
        }

        const basicEl = document.getElementById('tierViewBasic');
        const masterEl = document.getElementById('tierViewMaster');
        if (is35) {
          if (basicEl) basicEl.style.display = 'none';
          if (masterEl) masterEl.style.display = 'block';
        } else {
          if (masterEl) masterEl.style.display = 'none';
          if (basicEl) basicEl.style.display = 'block';
        }
      } catch (e) {
        console.warn('Report standalone init notice:', e);
      }
    })();
  </script>

</body>
</html>
